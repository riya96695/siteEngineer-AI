services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - vectorstore:/app/doc_vectorstore
      - uploads:/app/uploaded_docs
      - logs:/app/logs
      - hf_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  vectorstore:
  uploads:
  logs:
  hf_cache: